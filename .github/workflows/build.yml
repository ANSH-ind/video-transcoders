name: Build and Publish Wheels

on:
  push:
    branches: [ main ]
  release:
    types: [ published ]

jobs:
  build_wheels:
    name: Build wheel on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up QEMU (for multi-arch Linux)
        if: runner.os == 'Linux'
        uses: docker/setup-qemu-action@v3

      - name: Build wheels with cibuildwheel
        uses: pypa/cibuildwheel@v2.18.2
        env:
          # Linux (Ubuntu) ke liye FFmpeg dev headers & pkg-config install karna
          CIBW_BEFORE_ALL_LINUX: >
            apt-get update && apt-get install -y 
            libavformat-dev 
            libavcodec-dev 
            libavfilter-dev 
            libswscale-dev 
            libswresample-dev 
            libavutil-dev 
            pkg-config

          # macOS ke liye Homebrew se FFmpeg install karna
          CIBW_BEFORE_ALL_MACOS: >
            brew install ffmpeg pkg-config

          # PyPy aur 32-bit builds ko skip karna taaki time bache
          CIBW_SKIP: "pp* *-musllinux_* i686"

      - name: Upload wheels as artifact
        uses: actions/upload-artifact@v4
        with:
          name: cibuildwheel-${{ matrix.os }}
          path: ./wheelhouse/*.whl

  upload_pypi:
    needs: [build_wheels]
    runs-on: ubuntu-latest
    # Jab aap GitHub par naya Release publish karenge, tab yeh automatic PyPI par bhej dega
    if: github.event_name == 'release' && github.event.action == 'published'
    permissions:
      id-token: write

    steps:
      - name: Download all workflow artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: cibuildwheel-*
          merge-multiple: true
          path: dist

      - name: Publish package to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
