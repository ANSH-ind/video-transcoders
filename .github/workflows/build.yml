name: Build Wheels Directly

on:
  push:
    branches: [ main ]
  release:
    types: [ published ]

jobs:
  build_wheels:
    name: Build wheel on ubuntu-22.04
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Create Custom Manylinux Image
        run: |
          cat << 'EOF' > Dockerfile.manylinux
          FROM quay.io/pypa/manylinux_2_34_x86_64
          RUN dnf install -y --setopt=retries=10 --setopt=timeout=60 https://mirrors.rpmfusion.org/free/el/rpmfusion-free-release-9.noarch.rpm && \
              dnf install -y --setopt=retries=10 --setopt=timeout=60 epel-release && \
              dnf install -y --setopt=retries=10 --setopt=timeout=60 ffmpeg-devel pkgconfig
          EOF
          docker build -f Dockerfile.manylinux -t custom-manylinux:latest .

      - name: Build and Repair wheels via manylinux container
        run: |
          mkdir -p wheelhouse final_wheelhouse
          docker run --rm -v ${{ github.workspace }}:/project custom-manylinux:latest bash -c "
            mkdir -p /project/wheelhouse /project/final_wheelhouse
            for py in cp39-cp39 cp310-cp310 cp311-cp311 cp312-cp312; do
              PIP_BIN=/opt/python/\$py/bin/pip
              echo '=== Building wheel for \$py ==='
              \$PIP_BIN install --upgrade pip
              \$PIP_BIN wheel /project --wheel-dir=/project/wheelhouse --no-deps
            done
            
            echo '=== Repairing wheels with auditwheel ==='
            for whl in /project/wheelhouse/*.whl; do
              auditwheel repair \$whl -w /project/final_wheelhouse
            done
          "

      - name: Upload wheels as artifact
        uses: actions/upload-artifact@v4
        with:
          name: cibuildwheel-ubuntu-22.04
          path: ./final_wheelhouse/*.whl

  upload_pypi:
    needs: [build_wheels]
    runs-on: ubuntu-22.04
    if: github.event_name == 'release' && github.event.action == 'published'

    steps:
      - name: Download all workflow artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: cibuildwheel-*
          merge-multiple: true
          path: dist

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install twine
        run: |
          python -m pip install --upgrade pip
          pip install twine

      - name: Publish package to PyPI using twine
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          twine upload --verbose dist/*
