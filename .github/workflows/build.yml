name: Build Wheels via Local Custom Docker

on:
  push:
    branches: [ main ]
  release:
    types: [ published ]

jobs:
  build_wheels:
    name: Build wheel on ubuntu-latest
    runs-on: ubuntu-latest

    env:
      CIBW_MANYLINUX_X86_64_IMAGE: "custom-manylinux:latest"
      CIBW_BUILD: "cp39-* cp310-* cp311-* cp312-*"
      CIBW_SKIP: "pp* *-musllinux_* i686"
      CIBW_REPAIR_COMMAND: "cp {wheel} {dest_dir}"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Create Custom Manylinux Image
        run: |
          cat << 'EOF' > Dockerfile.manylinux
          FROM quay.io/pypa/manylinux_2_28_x86_64
          RUN dnf install -y https://mirrors.rpmfusion.org/free/el/rpmfusion-free-release-8.noarch.rpm && \
              dnf install -y epel-release && \
              dnf install -y ffmpeg-devel pkgconfig
          EOF
          docker build -f Dockerfile.manylinux -t custom-manylinux:latest .

      - name: Install cibuildwheel
        run: pip install --upgrade cibuildwheel

      - name: Build wheels
        run: cibuildwheel --output-dir wheelhouse

      - name: Upload wheels as artifact
        uses: actions/upload-artifact@v4
        with:
          name: cibuildwheel-ubuntu-latest
          path: ./wheelhouse/*.whl

  upload_pypi:
    needs: [build_wheels]
    runs-on: ubuntu-latest
    if: github.event_name == 'release' && github.event.action == 'published'
    permissions:
      id-token: write

    steps:
      - name: Download all workflow artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: cibuildwheel-*
          merge-multiple: true
          path: dist

      - name: Publish package to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
